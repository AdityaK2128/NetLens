name: NetLens
options:
  bundleIdPrefix: app.netlens
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.1"
    CURRENT_PROJECT_VERSION: "2"
    MACOSX_DEPLOYMENT_TARGET: "26.0"

targets:
  netlens-shaper:
    type: tool
    platform: macOS
    sources:
      - path: ShaperHelper
    settings:
      base:
        PRODUCT_NAME: netlens-shaper
        PRODUCT_BUNDLE_IDENTIFIER: app.netlens.shaper
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES

  NetLens:
    type: application
    platform: macOS
    sources:
      - path: NetLens
    dependencies:
      - target: netlens-shaper
        embed: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.netlens.NetLens
        PRODUCT_NAME: NetLens
        # Ad-hoc signed by default so anyone can build. To keep macOS permissions
        # (Location, Local Network) across rebuilds, sign with your own team — see
        # scripts/signing.local.example.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        GENERATE_INFOPLIST_FILE: NO
        MTL_FAST_MATH: YES
    info:
      path: NetLens/Info.plist
      properties:
        CFBundleName: NetLens
        CFBundleDisplayName: NetLens
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "NetLens — networking, explained visually."
        NSLocationUsageDescription: "macOS only reveals the Wi-Fi network name (SSID) and access point (BSSID) to apps with Location access. NetLens never stores or sends your location."
        NSLocationWhenInUseUsageDescription: "macOS only reveals the Wi-Fi network name (SSID) and access point (BSSID) to apps with Location access. NetLens never stores or sends your location."
        NSLocalNetworkUsageDescription: "NetLens discovers devices and Bonjour services on your local network, and probes your router (NAT-PMP) to detect carrier-grade NAT."
        NSBonjourServices:
          - _services._dns-sd._udp
          - _http._tcp
          - _https._tcp
          - _ssh._tcp
          - _sftp-ssh._tcp
          - _smb._tcp
          - _afpovertcp._tcp
          - _airplay._tcp
          - _raop._tcp
          - _companion-link._tcp
          - _googlecast._tcp
          - _spotify-connect._tcp
          - _ipp._tcp
          - _ipps._tcp
          - _printer._tcp
          - _pdl-datastream._tcp
          - _scanner._tcp
          - _uscan._tcp
          - _hap._tcp
          - _homekit._tcp
          - _matter._tcp
          - _matterc._udp
          - _meshcop._udp
          - _sleep-proxy._udp
          - _device-info._tcp
          - _workstation._tcp
          - _rfb._tcp
          - _adisk._tcp
          - _daap._tcp
          - _dpap._tcp
          - _touch-able._tcp
          - _mediaremotetv._tcp
          - _apple-mobdev2._tcp
          - _rdlink._tcp
          - _sonos._tcp
          - _hue._tcp
          - _esphomelib._tcp
          - _home-assistant._tcp
          - _mqtt._tcp
          - _ftp._tcp
          - _nfs._tcp
          - _webdav._tcp
          - _ptp._tcp
          - _sane-port._tcp
          - _airport._tcp
          - _amzn-wplay._tcp
          - _androidtvremote2._tcp
        NSAppTransportSecurity:
          NSExceptionDomains:
            ip-api.com:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
